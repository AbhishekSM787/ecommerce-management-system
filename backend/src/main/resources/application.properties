spring.application.name=ecommerce-management-system
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:replace-this-development-secret-with-a-long-random-secret-key-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL:admin@shopease.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
